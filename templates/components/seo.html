{% load static %}
<!-- Canonical URL -->
<link rel="canonical" href="{{ request.build_absolute_uri }}">

<!-- Robots -->
<meta name="robots" content="noindex, nofollow">

<!-- Open Graph -->
<meta property="og:title" content="Draft Manager">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ request.build_absolute_uri }}">
<meta property="og:description" content="Prepare personalised Outlook drafts from a contact list.">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Draft Manager">
<meta name="twitter:description" content="Prepare personalised Outlook drafts from a contact list.">
