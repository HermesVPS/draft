<!--TEMPLATE/COMPONENTS/TOP-NAVBAR.HTML-->
{% load static %}
<div class="navbar bg-base-100 border-b border-base-300 shadow-sm px-4 md:px-16">
  <div class="navbar-start">
    <a href="{% url 'dashboard:home' %}" class="flex items-center gap-2">
      <i class="fa-regular fa-envelope text-primary text-xl"></i>
      <span class="font-poppins font-medium text-primary text-lg">Draft Manager</span>
    </a>
  </div>

  <div class="navbar-end">
    {% if user.is_authenticated %}
      <div class="dropdown dropdown-end">
        <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
          <div class="w-10 rounded-full">
            <img alt="Avatar" src="https://ui-avatars.com/api/?name={{ user.first_name }}+{{ user.last_name }}&background=random" />
          </div>
        </div>
        <ul tabindex="0" class="mt-3 z-[1] p-2 shadow menu menu-sm dropdown-content bg-base-100 rounded-box w-52">
          <li><a href="{% url 'dashboard:home' %}">Dashboard</a></li>
          <li><a href="{% url 'account:profile' %}">Profile</a></li>
          <li><a href="{% url 'account:logout' %}">Logout</a></li>
        </ul>
      </div>
    {% else %}
      <a href="{% url 'account_login' %}" class="btn btn-ghost ml-2">Login</a>
      <a href="{% url 'account_signup' %}" class="btn btn-primary ml-2">Sign Up</a>
    {% endif %}
  </div>
</div>
