<!--TEMPLATE/COMPONENTS/MESSAGES.HTML-->

{% if messages %}
    <div class="fixed bottom-4 right-12 w-auto transition-all duration-1000 ease-in-out  z-50" id="message-container">
        {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}bg-error border border-error p-2 rounded-sm
            text-info-content text-xs
            my-2
            space-y-2{% elif message.tags == 'success' %}bg-success border border-success p-2 rounded-sm text-info-content text-xs my-2
            space-y-2{% elif message.tags == 'warning' %}bg-warning border border-warning p-2 rounded-sm
            text-info-content text-xs
            my-2{% elif message.tags == 'info' %}bg-success border border-success p-2 rounded-sm text-info-content text-xs my-2{%
                    else %}bg-success border border-success p-2 rounded-sm text-info-content text-xs my-2 space-y-2 {% endif %} shadow-sm
                    message-alert">
                <div>
                    {% if message.tags == 'error' %}
                        <i class="fa-regular fa-circle-exclamation"></i>
                    {% elif message.tags == 'success' %}
                        <i class="fa-regular fa-circle-check"></i>
                    {% elif message.tags == 'warning' %}
                        <i class="fa-regular fa-triangle-exclamation"></i>
                    {% else %}
                        <i class="fa-regular fa-circle-info"></i>
                    {% endif %}
                    <span>{{ message }}</span>
                </div>
            </div>
        {% endfor %}
    </div>

    <script>
        // Auto-hide messages after 5 seconds (5000 milliseconds)
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const messageContainer = document.getElementById('message-container');
                if (messageContainer) {
                    // Fade out effect
                    messageContainer.style.transition = 'opacity 1s';
                    messageContainer.style.opacity = '0';

                    // Remove from DOM after fade completes
                    setTimeout(function() {
                        messageContainer.remove();
                    }, 1000);
                }
            },2000);
        });
    </script>
{% endif %}
